<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury Product Gallery 🛍️</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Header Section -->
    <header class="header">
      <div class="header-content">
        <h1 class="logo">
          <i class="fas fa-gem"></i>
          Luxury <span>Collection</span>
        </h1>
        <p class="tagline">Discover Exclusive Premium Products</p>
      </div>
    </header>

    <main>
      <!-- Main Container -->
      <div class="container">
        <!-- Filter Controls Section -->
        <div class="filter-container">
          <!-- Filter Buttons -->
          <div class="filter-section">
            <h3 class="filter-title">
              <i class="fas fa-filter"></i>
              Filter by Price
            </h3>
            <div class="buttons-div">
              <button class="filter-btn active" data-filter="all">
                <i class="fas fa-layer-group"></i>
                All Products
              </button>
              <button class="filter-btn" data-filter="over-200">
                <i class="fas fa-crown"></i>
                Ultra Premium (200M+)
              </button>
              <button class="filter-btn" data-filter="over-100">
                <i class="fas fa-star"></i>
                Premium (100M+)
              </button>
              <button class="filter-btn" data-filter="lover-then-100">
                <i class="fas fa-bolt"></i>
                Affordable (Under 100M)
              </button>
            </div>
          </div>

          <!-- Price Range Slider -->
          <div class="range-section">
            <h3 class="filter-title">
              <i class="fas fa-sliders-h"></i>
              Price Range
            </h3>
            <div class="range-div">
              <span class="range-input-text">
                <i class="fas fa-dollar-sign"></i>
                20M
              </span>
              <div class="range-input-value-div">
                <span class="input-value-text">
                  <i class="fas fa-hand-point-left"></i>
                  Max: <span class="value-display">300</span>M$
                </span>
                <input
                  type="range"
                  id="range-input"
                  min="100"
                  max="300"
                  step="100"
                  value="300"
                />
                <div class="range-ticks">
                  <span>100M</span>
                  <span>200M</span>
                  <span>300M</span>
                </div>
              </div>
              <span class="range-input-text">
                <i class="fas fa-dollar-sign"></i>
                300M
              </span>
            </div>
          </div>

          <!-- Stats Section -->
          <div class="stats-section">
            <div class="stat-box">
              <i class="fas fa-box-open"></i>
              <div>
                <span class="stat-value" id="total-products">0</span>
                <span class="stat-label">Total Products</span>
              </div>
            </div>
            <div class="stat-box">
              <i class="fas fa-eye"></i>
              <div>
                <span class="stat-value" id="visible-products">0</span>
                <span class="stat-label">Currently Showing</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Products Grid Section -->
        <div class="product-container">
          <!-- Products will be dynamically loaded here -->
          <div class="loading-container">
            <img
              src="./assets/loading.gif"
              alt="Loading products..."
              class="loading-element show"
            />
            <p class="loading-text">Loading Luxury Collection...</p>
          </div>
          
        </div>
      </div>
    </main>
    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 Luxury Collection Gallery. All rights reserved.</p>
      <div class="footer-links">
        <a href="#"><i class="fab fa-github"></i> GitHub</a>
        <a href="#"><i class="fab fa-tel"></i> Telegrame</a>
      </div>
      <p class="creator-credit">
        Made with <span class="heart">❤️</span> by Mohammad
      </p>
    </footer>

    <!-- Script -->
    <script src="./main.js"></script>
  </body>
</html>
